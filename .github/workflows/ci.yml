name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # CPU wheels of the pinned PyTorch; the tests use tiny models and fake data,
      # so no GPU, dataset download or model weights are needed.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,llm,hf,camelyon]"

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Test
        run: python -m pytest

  docker:
    name: Docker image (build, test, diagnose an example)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          tags: runsleuth-test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the tests inside the image
        run: docker run --rm runsleuth-test

      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          tags: runsleuth
          load: true
          cache-from: type=gha

      - name: Diagnose and verify the example runs inside the image
        run: |
          docker run --rm -v "$PWD/examples:/work/examples:ro" runsleuth diagnose \
            --run examples/frozen_head/run_report.json \
            --reference examples/clean/run_report.json --no-llm | tee diagnosis.txt
          grep -q "Diagnosis: frozen_head" diagnosis.txt
          docker run --rm -v "$PWD/examples:/work/examples:ro" runsleuth verify \
            --candidate examples/frozen_head_repaired/run_report.json \
            --reference examples/clean/run_report.json \
            --faulty examples/frozen_head/run_report.json | tee verification.txt
          grep -q "Decision: accepted" verification.txt

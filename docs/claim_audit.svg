<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 358" width="1000" height="358" role="img" aria-labelledby="title desc" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="title">Auditing the claims of an agent-built classifier</title>
  <desc id="desc">One site of the data is sealed away. An LLM agent gets the rest, writes a training program and tries it on a small copy. The official run delivers a network, a report and a record of the rows each trained network used. For each use the report gives an estimate with a 95% interval, or says the use is not estimable. Three evidence tables are computed from the run: provenance, what each estimate was measured on; replication, the same program with new seeds; and regime-matched, each development site held out in turn. AI auditors read the report, then the code and log, then one table; they decide whether each claim is supported and forecast the sealed performance. Regimes sealed before any agent ran score every claim: its warrant, judged without the sealed results, and the forecasts of agents, auditors and fixed rules against the sealed regime.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3d3a8c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="358" rx="10" fill="#ffffff"/>
  <rect x="12" y="30" width="150" height="74" rx="8" fill="#eeecf8" stroke="#3d3a8c" stroke-width="1.5"/>
  <text x="87.0" y="55" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1a26">Development data</text>
  <text x="87.0" y="74" text-anchor="middle" font-size="12" fill="#5e5870">one site sealed away;</text>
  <text x="87.0" y="91" text-anchor="middle" font-size="12" fill="#5e5870">the agent splits the rest</text>
  <rect x="190" y="30" width="160" height="74" rx="8" fill="#eeecf8" stroke="#3d3a8c" stroke-width="1.5"/>
  <text x="270.0" y="55" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1a26">LLM agent</text>
  <text x="270.0" y="74" text-anchor="middle" font-size="12" fill="#5e5870">writes train.py and runs</text>
  <text x="270.0" y="91" text-anchor="middle" font-size="12" fill="#5e5870">it on a small copy</text>
  <rect x="378" y="30" width="170" height="74" rx="8" fill="#eeecf8" stroke="#3d3a8c" stroke-width="1.5"/>
  <text x="463.0" y="55" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1a26">Official run</text>
  <text x="463.0" y="74" text-anchor="middle" font-size="12" fill="#5e5870">delivered network, report,</text>
  <text x="463.0" y="91" text-anchor="middle" font-size="12" fill="#5e5870">partition record</text>
  <rect x="576" y="30" width="196" height="74" rx="8" fill="#eeecf8" stroke="#3d3a8c" stroke-width="1.5"/>
  <text x="674.0" y="55" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1a26">Claim per use</text>
  <text x="674.0" y="74" text-anchor="middle" font-size="12" fill="#5e5870">estimate and 95% interval,</text>
  <text x="674.0" y="91" text-anchor="middle" font-size="12" fill="#5e5870">or not estimable</text>
  <rect x="190" y="146" width="520" height="92" rx="8" fill="#f8e6ed" stroke="#b8325f" stroke-width="1.5"/>
  <text x="450.0" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1a26">Evidence tables</text>
  <text x="450.0" y="190" text-anchor="middle" font-size="12" fill="#5e5870">provenance: what each estimate was measured on</text>
  <text x="450.0" y="208" text-anchor="middle" font-size="12" fill="#5e5870">replication: the same program with new seeds</text>
  <text x="450.0" y="224" text-anchor="middle" font-size="12" fill="#5e5870">regime-matched: each development site held out in turn</text>
  <rect x="746" y="146" width="242" height="92" rx="8" fill="#eeecf8" stroke="#3d3a8c" stroke-width="1.5"/>
  <text x="867.0" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1a26">AI auditors</text>
  <text x="867.0" y="190" text-anchor="middle" font-size="12" fill="#5e5870">read the report, then the code</text>
  <text x="867.0" y="208" text-anchor="middle" font-size="12" fill="#5e5870">and log, then one table;</text>
  <text x="867.0" y="224" text-anchor="middle" font-size="12" fill="#5e5870">decide and forecast</text>
  <rect x="12" y="280" width="230" height="62" rx="8" fill="#ffffff" stroke="#3d3a8c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="127.0" y="299" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1a26">Sealed regimes</text>
  <text x="127.0" y="318" text-anchor="middle" font-size="12" fill="#5e5870">fixed before any agent ran;</text>
  <text x="127.0" y="335" text-anchor="middle" font-size="12" fill="#5e5870">no agent or auditor sees them</text>
  <rect x="270" y="280" width="718" height="62" rx="8" fill="#ffffff" stroke="#3d3a8c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="629.0" y="299" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1a26">Scores per claim</text>
  <text x="629.0" y="318" text-anchor="middle" font-size="12" fill="#5e5870">warrant: does the evidence support the claim, judged without the sealed results</text>
  <text x="629.0" y="335" text-anchor="middle" font-size="12" fill="#5e5870">forecasts of agents, auditors and fixed rules against the sealed regime</text>
  <g fill="none" stroke="#3d3a8c" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M162 67 H187"/>
    <path d="M350 67 H375"/>
    <path d="M548 67 H573"/>
    <path d="M463 104 V143"/>
    <path d="M772 67 H867 V143"/>
    <path d="M710 192 H743"/>
  </g>
  <path d="M242 311 H267" fill="none" stroke="#3d3a8c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
</svg>

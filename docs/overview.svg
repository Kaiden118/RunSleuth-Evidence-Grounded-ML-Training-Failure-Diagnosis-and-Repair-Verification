<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 272" width="1000" height="272" role="img" aria-labelledby="title desc" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="title">Verifying an LLM agent's repair</title>
  <desc id="desc">An LLM agent repairs a faulty training project. The harness runs the candidate, stopping and restarting it and recording what trained. RunSleuth v2 judges each requirement as supported, violated or untested from the run's records and from probe runs chosen by what is still untested, then accepts, sends to review or rejects. Hidden behavioural tests label every candidate and are never seen by a verifier.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3d3a8c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="272" rx="10" fill="#ffffff"/>
  <rect x="12" y="86" width="150" height="78" rx="8" fill="#eeecf8" stroke="#3d3a8c" stroke-width="1.5"/>
  <text x="87.0" y="113" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1a26">Repair task</text>
  <text x="87.0" y="132" text-anchor="middle" font-size="12" fill="#5e5870">statement and a</text>
  <text x="87.0" y="149" text-anchor="middle" font-size="12" fill="#5e5870">faulty project</text>
  <rect x="190" y="86" width="160" height="78" rx="8" fill="#eeecf8" stroke="#3d3a8c" stroke-width="1.5"/>
  <text x="270.0" y="113" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1a26">LLM agent</text>
  <text x="270.0" y="132" text-anchor="middle" font-size="12" fill="#5e5870">edits the code, runs</text>
  <text x="270.0" y="149" text-anchor="middle" font-size="12" fill="#5e5870">short trainings</text>
  <rect x="378" y="86" width="170" height="78" rx="8" fill="#eeecf8" stroke="#3d3a8c" stroke-width="1.5"/>
  <text x="463.0" y="113" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1a26">Harness run</text>
  <text x="463.0" y="132" text-anchor="middle" font-size="12" fill="#5e5870">stopped and restarted;</text>
  <text x="463.0" y="149" text-anchor="middle" font-size="12" fill="#5e5870">records what trained</text>
  <rect x="576" y="86" width="196" height="78" rx="8" fill="#f8e6ed" stroke="#b8325f" stroke-width="1.5"/>
  <text x="674.0" y="113" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1a26">RunSleuth v2</text>
  <text x="674.0" y="132" text-anchor="middle" font-size="12" fill="#5e5870">judges each requirement:</text>
  <text x="674.0" y="149" text-anchor="middle" font-size="12" fill="#5e5870">supported, violated, untested</text>
  <rect x="806" y="42" width="182" height="44" rx="8" fill="#e7f3ec" stroke="#2f7d4f" stroke-width="1.5"/>
  <text x="897.0" y="60" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1a26">Accept</text>
  <text x="897.0" y="80" text-anchor="middle" font-size="12" fill="#5e5870">every part supported</text>
  <rect x="806" y="103" width="182" height="44" rx="8" fill="#fbf1dc" stroke="#a86b00" stroke-width="1.5"/>
  <text x="897.0" y="122" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1a26">Review</text>
  <text x="897.0" y="140" text-anchor="middle" font-size="12" fill="#5e5870">some part untested</text>
  <rect x="806" y="164" width="182" height="44" rx="8" fill="#f8e6ed" stroke="#b8325f" stroke-width="1.5"/>
  <text x="897.0" y="182" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1a26">Reject</text>
  <text x="897.0" y="202" text-anchor="middle" font-size="12" fill="#5e5870">a part violated</text>
  <rect x="576" y="206" width="196" height="50" rx="8" fill="#eeecf8" stroke="#3d3a8c" stroke-width="1.5"/>
  <text x="674.0" y="228" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1a26">Probe runs</text>
  <text x="674.0" y="246" text-anchor="middle" font-size="12" fill="#5e5870">chosen by the evidence gap</text>
  <rect x="190" y="206" width="358" height="50" rx="8" fill="#ffffff" stroke="#3d3a8c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="369.0" y="228" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1a26">Hidden behavioural tests</text>
  <text x="369.0" y="246" text-anchor="middle" font-size="12" fill="#5e5870">label every candidate; no verifier sees them</text>
  <g fill="none" stroke="#3d3a8c" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M162 125 H187"/>
    <path d="M350 125 H375"/>
    <path d="M548 125 H573"/>
    <path d="M772 125 H788 V64 H803"/>
    <path d="M772 125 H803"/>
    <path d="M772 125 H788 V186 H803"/>
    <path d="M652 164 V203"/>
    <path d="M696 206 V167"/>
  </g>
  <path d="M270 164 V203" fill="none" stroke="#3d3a8c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
</svg>
